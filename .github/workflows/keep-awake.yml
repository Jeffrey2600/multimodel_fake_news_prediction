# Free Hugging Face Spaces sleep after 48 hours without visitors.
# This visits the live app every 6 hours so it is always ready.
name: Keep live demo awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://jeffrey2600-truthlens.hf.space/api/status) && echo "status $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          echo "App did not answer with 200 after 3 tries"
